<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XueyanZ</title>
  {% seo title=false %}
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/images/favicon-32.png' | relative_url }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/images/favicon-180.png' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <!-- Font Awesome for Social Media Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css?family=Open+Sans:400,600,700&display=swap" rel="stylesheet">
</head>

<body>

  <header class="site-header">
    <div class="wrapper">
      <div class="site-title">
        <a href="{{ '/' | relative_url }}" style="font-weight: normal;">
          <img src="{{ '/assets/images/XYZsticker.PNG' | relative_url }}" alt="XYZ sticker" class="site-logo">
          <div>Xueyan Zhang</div>
          <!-- <div>张学焱</div> -->
        </a>
      </div>
      <nav class="site-nav">
        <!-- Blog hidden until there are posts; re-enable with published: true in blog.md -->
        <a href="{{ '/assets/files/CV_XueyanZhang.pdf' | relative_url }}"
          style="font-weight: bold; font-size: 1rem; vertical-align: middle;">CV</a>
      </nav>
    </div>
  </header>

  <main class="page-content">
    <div class="wrapper">
      {{ content }}
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrapper">
      <p>&copy; {{ 'now' | date: "%Y" }} Xueyan Zhang. Powered by Jekyll.</p>
    </div>
  </footer>

  <!-- GoatCounter: cookieless analytics (pageviews, section views, link clicks) -->
  <script data-goatcounter="https://xueyanz.goatcounter.com/count"
    async src="https://gc.zgo.at/count.v5.js" crossorigin="anonymous"
    integrity="sha384-atnOLvQb9t+jTSipvd75X2yginT4PjVbqDdlJAmxMm+wYElFmeR6EmLP5bYeoRVQ"></script>
  <script>
    (function () {
      function track(path, title) {
        if (window.goatcounter && window.goatcounter.count) {
          window.goatcounter.count({ path: path, title: title, event: true });
        } else {
          setTimeout(function () { track(path, title); }, 500);
        }
      }

      // Count each section heading once, the first time it scrolls into view
      if ('IntersectionObserver' in window) {
        var seen = {};
        var observer = new IntersectionObserver(function (entries) {
          entries.forEach(function (entry) {
            var id = entry.target.id;
            if (entry.isIntersecting && !seen[id]) {
              seen[id] = true;
              track('section-' + id, entry.target.textContent);
              observer.unobserve(entry.target);
            }
          });
        });
        document.querySelectorAll('main h2[id]').forEach(function (h) { observer.observe(h); });
      }

      // Count CV/PDF downloads and outbound link clicks
      document.addEventListener('click', function (e) {
        var a = e.target.closest && e.target.closest('a[href]');
        if (!a) return;
        var url = new URL(a.href, location.href);
        if (/\.pdf$/i.test(url.pathname)) {
          track('download-' + url.pathname.split('/').pop(), a.textContent.trim());
        } else if (url.host && url.host !== location.host) {
          track('click-' + url.host + url.pathname, a.textContent.trim() || url.host);
        }
      });
    })();
  </script>

</body>

</html>
