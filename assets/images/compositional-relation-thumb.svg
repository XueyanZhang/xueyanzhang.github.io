<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" width="160" height="120">
  <rect width="160" height="120" fill="#f2f2f2"/>

  <circle cx="28" cy="60" r="16" fill="#fff" stroke="#888" stroke-width="2.5"/>
  <text x="28" y="65" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#444">A</text>

  <circle cx="80" cy="60" r="16" fill="#fff" stroke="#888" stroke-width="2.5"/>
  <text x="80" y="65" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#444">B</text>

  <circle cx="132" cy="60" r="16" fill="#fff" stroke="#888" stroke-width="2.5"/>
  <text x="132" y="65" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#444">C</text>

  <!-- A -> B: succeeds -->
  <line x1="44" y1="60" x2="62" y2="60" stroke="#3a7d3a" stroke-width="2.5" marker-end="url(#arrowGreen)"/>

  <!-- B -> C: fails -->
  <line x1="96" y1="60" x2="114" y2="60" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="4,3" marker-end="url(#arrowRed)"/>

  <defs>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#3a7d3a"/>
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#c0392b"/>
    </marker>
  </defs>
</svg>
